# Lightweight CI on every push/PR (the Jenkinsfile is the full deploy pipeline).
name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=src python -m voyage.validate data
      - run: PYTHONPATH=src python -m voyage.train_all --no-register
      - run: PYTHONPATH=src python -m voyage.validate gate
      - run: PYTHONPATH=src pytest -q tests
      - run: docker build -t voyage-api:ci .
