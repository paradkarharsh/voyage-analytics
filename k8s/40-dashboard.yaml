apiVersion: apps/v1
kind: Deployment
metadata:
  name: voyage-dashboard
  namespace: voyage
spec:
  replicas: 1
  selector:
    matchLabels: {app: voyage-dashboard}
  template:
    metadata:
      labels: {app: voyage-dashboard}
    spec:
      containers:
        - name: dashboard
          image: voyage-dashboard:latest
          imagePullPolicy: IfNotPresent
          env:
            - {name: API_URL, value: "http://voyage-api:5000"}
          ports: [{containerPort: 8501}]
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 768Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: voyage-dashboard
  namespace: voyage
spec:
  type: NodePort
  selector: {app: voyage-dashboard}
  ports:
    - {port: 8501, targetPort: 8501, nodePort: 30851}
